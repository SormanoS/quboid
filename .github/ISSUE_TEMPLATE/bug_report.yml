name: Bug report
description: Something doesn't work as expected
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Quboid can't see your setup, so the details below are what make a bug fixable.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Notepad\n2. Press Ctrl+Alt+Left Arrow\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quboid version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: ["Windows 11", "Windows 10 22H2"]
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: How did you install Quboid?
      options: ["Microsoft Store", "winget", "MSI installer", "Portable ZIP", "Scoop", "Built from source"]
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: One line per monitor — resolution, scaling and where it sits relative to the main one.
      placeholder: "Main: 2560x1440 at 125%\nLeft of main: 1920x1080 at 100%"
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard layout
      placeholder: "Italian, US, German…"
  - type: dropdown
    id: source
    attributes:
      label: How did you find Quboid? (optional)
      options: ["Microsoft Store search", "GitHub", "Hacker News", "Reddit", "An article", "A friend or colleague", "Other"]
