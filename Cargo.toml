[workspace]
members = [
    "crates/quboid-app",
    "crates/quboid-core",
    "crates/quboid-ui",
    "crates/quboid-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Samuele Sormano"]
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
crossbeam-channel = "0.5.15"
eframe = { version = "0.36.1", default-features = false, features = ["glow"] }
egui = "0.36.1"
embed-resource = "3.0.11"
egui_kittest = "0.36.1"
rfd = "0.17.2"
proptest = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serial_test = "4.0.1"
tempfile = "3.27.0"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
